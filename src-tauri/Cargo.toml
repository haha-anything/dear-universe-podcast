# Rust 侧依赖。
#
# 只装当前接通的功能真正用到的东西（AGENTS.md：不写没接通的死代码）。
# 接通范围随里程碑推进：M1 数据层 → M4 下载 → M5 通知/更新/单实例。

[package]
name = "dear-universe-podcast"
version = "0.1.0"
description = "大宇宙播客 —— 轻量开源桌面播客客户端"
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` 后缀看着多余，但 Windows 上不加会和 bin 名冲突，见 cargo#8519
name = "dear_universe_podcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：M0 就要验证「最小化到托盘后音频不能断」
# protocol-asset：M4 离线播放，把已下载的本地音频交给 WebView 播（asset:// 协议）
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }

# M5 发布能力：通知、自动更新、单实例锁、打开外链、文件选择
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# bundled：把 SQLite 编进二进制，用户机器上不需要预装 SQLite（任务书 §4）
rusqlite = { version = "0.32", features = ["bundled"] }

# rustls 而不是 openssl：Windows 上 openssl 是噩梦（任务书 §4）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
# sync：刷新要用 Semaphore 把并发压到 3（任务书 §13）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
feed-rs = "2"
# 下载要按块流式写盘，reqwest 的 bytes_stream 靠它驱动
futures-util = "0.3"
url = "2"

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# 测试要用临时目录当数据目录，跑完自动清理
tempfile = "3"

# 打包瘦身见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
