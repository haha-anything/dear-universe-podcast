# 打 tag 时自动构建 Windows 安装包并发布 Release，顺带产出自动更新所需的 latest.json。
# 本机打包卡在下载 NSIS 工具链被代理拦截（502），GitHub Runner 不受此限制。
#
# 前置：仓库 Settings → Secrets 里放 TAURI_SIGNING_PRIVATE_KEY（更新签名私钥）。
# 客户端 tauri.conf.json 里已配好对应公钥与 GitHub Releases 端点。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "大宇宙播客 v__VERSION__"
          releaseBody: "自动构建。Windows 安装包（NSIS），含自动更新签名产物。"
          releaseDraft: false
          prerelease: false
